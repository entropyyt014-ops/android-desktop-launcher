name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, test, and render
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "14742923"

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Verify build graph
        run: ./gradlew --no-daemon --stacktrace projects

      - name: Run unit tests and lint
        run: |
          ./gradlew --no-daemon --stacktrace             :core:device:testDebugUnitTest             :core:designsystem:testDebugUnitTest             :app:testDebugUnitTest             :app:lintDebug

      - name: Render and validate Stage shell screenshots
        run: |
          ./gradlew --no-daemon --stacktrace :app:updateDebugScreenshotTest
          ./gradlew --no-daemon --stacktrace :app:validateDebugScreenshotTest

      - name: Upload rendered Stage shell screenshots
        uses: actions/upload-artifact@v4
        with:
          name: stage-shell-screenshots
          path: app/src/screenshotTestDebug/reference/*.png
          if-no-files-found: error

      - name: Build signed debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stage-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
